<rect class="bg" x="0.5" y="0.5" width="1039" height="723" rx="16"/>
<text class="h" x="32" y="46">macOS-App: Aufbau</text>
<text class="m" x="32" y="70">Grob gilt: Jede Schicht nutzt die darunter. Die Widget-Erweiterung spricht nur über eine Datei und über Links mit der App.</text>

