<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 724" width="1040" height="724" role="img" aria-labelledby="t d">
<title id="t">MinerGuru macOS: Aufbau</title>
<desc id="d">Fünf Schichten: App-Einstieg mit Fenster, Menüleiste und Einstellungen; Ansichten; Zustand mit MinerStore und Teil-Stores; Dienste für Netz und Querschnitt; Speicher. Rechts die Widget-Erweiterung, die einen Schnappschuss liest und per minerguru-Link zurück in die App springt, und die Modelle.</desc>
