.h{font-size:19px;font-weight:650}.b{font-size:14px;font-weight:600}.t{font-size:13px;font-weight:600}.m{font-size:12.5px;fill:#6e6e73}
.c,.c text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;fill:#3a3a3c}
.z{font-size:12.5px;font-weight:600;fill:#8a8a8e}
.bg{fill:#fafafa;stroke:#e4e4e7}.card{fill:#fff;stroke:#d4d4d9}.raised{fill:#f1f1f3;stroke:#d9d9de}
.hot{fill:#fdf3e6;stroke:#e0923a}
.ln{fill:none;stroke:#8e8e93;stroke-width:1.5}.la{fill:none;stroke:#d9780a;stroke-width:1.8}
.ah{fill:#8e8e93}.aa{fill:#d9780a}
@media (prefers-color-scheme:dark){
text{fill:#f2f2f3}.m{fill:#a1a1a6}.c,.c text{fill:#d1d1d6}.z{fill:#8e8e93}
.bg{fill:#141415;stroke:#2c2c2f}.card{fill:#1c1c1e;stroke:#3a3a3e}.raised{fill:#242426;stroke:#38383c}
.hot{fill:#2d2114;stroke:#b8762c}
.ln{stroke:#7c7c82}.ah{fill:#7c7c82}.la{stroke:#f0a03c}.aa{fill:#f0a03c}}
</style>
<defs>
